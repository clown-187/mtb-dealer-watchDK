name: MTB Dealer Watch

on:
  schedule:
    - cron: "15 * * * *"   # hver time
  workflow_dispatch:        # manuel start

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gendan seen.json fra cache
        uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Installer afhaengigheder
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Kør agent
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
